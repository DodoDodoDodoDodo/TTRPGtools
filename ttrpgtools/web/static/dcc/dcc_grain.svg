<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360">
  <!-- Tileable print grain, grey on white, meant to multiply over a flat pastel field. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.25  0 0 0 0 0.25  0 0 0 0 0.25  0.6 0.6 0.6 0 -0.72"/>
  </filter>
  <rect width="360" height="360" fill="#fff"/>
  <rect width="360" height="360" filter="url(#grain)"/>
</svg>
