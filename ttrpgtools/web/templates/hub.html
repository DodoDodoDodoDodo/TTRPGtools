<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TTRPG</title>
  <style>
    /* The front door: nothing but the three games. Each tile wears its game's own colors. */
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1f3f5; color: #1f2933;
           font: 18px/1.4 Georgia, "Times New Roman", serif; padding: 1.5rem; }
    main { width: min(980px, 100%); }
    h1 { font: 700 1rem "Trebuchet MS", "Gill Sans", sans-serif; letter-spacing: .3em; text-transform: uppercase; color: #3665a3; margin: 0 0 1.2rem; }
    .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.2rem; }
    a.game { display: block; text-decoration: none; border-radius: 4px; padding: 1.6rem 1.4rem 1.4rem; min-height: 190px; border: 1.5px solid #2f2e30;
             box-shadow: 5px 5px 0 rgba(47, 46, 48, .35); transition: transform .08s, box-shadow .08s; }
    a.game:hover, a.game:focus-visible { transform: translate(2px, 2px); box-shadow: 3px 3px 0 rgba(47, 46, 48, .35); outline: none; }
    .game b { display: block; font: 700 1.6rem/1.15 "Trebuchet MS", "Gill Sans", sans-serif; letter-spacing: .06em; text-transform: uppercase; margin-bottom: .6rem; }
    .game span { display: block; font-size: .98rem; }
    .dcc { background: #8fbd95; color: #2f2e30; } .dcc b { color: #7a2f0c; }
    .dnd5e { background: #f3e9d2; color: #2a2118; } .dnd5e b { color: #7a1f0e; }
    .dh1e { background: #17130f; color: #d8cfc0; } .dh1e b { color: #e0bb6e; }
    p.home { margin-top: 1.6rem; font-size: .9rem; } p.home a { color: #3665a3; }
  </style>
</head>
<body>
  <main>
    <h1>TTRPG</h1>
    <div class="games">
      <a class="game dcc" href="{{ url_for('dcc.index') }}"><b>Dungeon Crawl Classics</b>
        <span>The west marches campaign: villagers, characters, town, shops and inns.</span></a>
      <a class="game dnd5e" href="{{ url_for('dnd5e.index') }}"><b>D&amp;D 5e</b>
        <span>Encounter builder, difficulty estimate and combat tracker.</span></a>
      <a class="game dh1e" href="{{ url_for('dh1e.character_list') }}"><b>Dark Heresy 1e</b>
        <span>Acolyte dossiers: careers, advances and experience.</span></a>
    </div>
    <p class="home"><a href="/">&larr; your-domain</a></p>
  </main>
</body>
</html>
