<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Character Records{% endblock %} :: Adeptus Administratum</title>
  <link rel="stylesheet" href="{{ static_v('style.css') }}">
  <link rel="stylesheet" href="{{ static_v('helper.css') }}">
  <script>window.DODO_HELPER = {site: 'dh1e', api: '/TTRPG/dh1e/api', header: '.masthead-nav', title: 'Rules helper',
    placeholder: 'Ask about a rule, e.g. how do Fate Points work?'};</script>
  <script src="{{ static_v('helper.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="masthead">
    {% block brand %}<a class="masthead-title" href="{{ url_for('dh1e.character_list') }}">ADEPTUS ADMINISTRATUM <span>&mdash; Dossier Register</span></a>{% endblock %}
    <nav class="masthead-nav">
      <a href="{{ url_for('hub') }}">&larr; Back to /TTRPG</a>
    </nav>
  </header>
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
{% include "_footer.html" %}
</body>
</html>
